<!doctype html>
<html class="no-js" lang="en">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>Registration Certificate &#8211; Sankalp International School</title>
	<meta name="description" content="View Registration Certificate of Sankalp International School">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- favicon -->
	<link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">

	<!-- Google Fonts -->
	<link href='https://fonts.googleapis.com/css?family=Poppins:400,300,500,600,700' rel='stylesheet' type='text/css'>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css"
		integrity="sha512-SzlrxWUlpfuzQ+pcUCosxcglQRNAq/DZjVsC0lE40xsADsfeQoEypE+enwcOiGjk/bSuGGKHEyjSoQ1zVisanQ=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />

	<!-- Style CSS -->
	<link rel="stylesheet" href="css/mobile-menu.css">
	<link rel="stylesheet" href="style.css">

	<style>
		/* Certificate Gallery Section */
		.cert-section {
			padding: 60px 0;
			background: #f9f9f9;
			min-height: 50vh;
		}

		.cert-title-wrapper {
			text-align: center;
			margin-bottom: 40px;
		}

		.cert-title-wrapper h2 {
			font-size: 30px;
			font-weight: 700;
			color: #2d2d2d;
			position: relative;
			padding-bottom: 15px;
			display: inline-block;
		}

		.cert-title-wrapper h2::after {
			content: '';
			position: absolute;
			bottom: 0;
			left: 50%;
			transform: translateX(-50%);
			width: 70px;
			height: 3px;
			background: #fdc735;
			border-radius: 2px;
		}

		.cert-title-wrapper p {
			color: #777;
			font-size: 15px;
			margin-top: 10px;
		}

		.cert-gallery-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
			gap: 25px;
			max-width: 1100px;
			margin: 0 auto;
			padding: 0 15px;
		}

		.cert-card {
			background: #fff;
			border-radius: 12px;
			overflow: hidden;
			box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
			transition: transform 0.3s ease, box-shadow 0.3s ease;
		}

		.cert-card:hover {
			transform: translateY(-6px);
			box-shadow: 0 12px 30px rgba(0, 0, 0, 0.13);
		}

		.cert-card img {
			width: 100%;
			height: auto;
			display: block;
			border-bottom: 3px solid #fdc735;
		}

		.cert-card-label {
			padding: 12px 16px;
			font-size: 14px;
			font-weight: 600;
			color: #444;
			text-align: center;
			letter-spacing: 0.3px;
		}

		.cert-back-btn-wrap {
			text-align: center;
			margin-top: 45px;
		}

		.cert-back-btn {
			display: inline-block;
			padding: 13px 32px;
			background: linear-gradient(135deg, #fdc735, #f9a800);
			color: #fff;
			border-radius: 30px;
			font-weight: 700;
			font-size: 14px;
			text-decoration: none;
			letter-spacing: 0.5px;
			text-transform: uppercase;
			box-shadow: 0 5px 18px rgba(253, 199, 53, 0.45);
			transition: all 0.3s ease;
		}

		.cert-back-btn:hover {
			background: linear-gradient(135deg, #004296, #0062cc);
			box-shadow: 0 8px 22px rgba(0, 66, 150, 0.4);
			color: #fff;
		}

		@media (max-width: 575px) {
			.cert-gallery-grid {
				grid-template-columns: 1fr;
				gap: 18px;
			}

			.cert-title-wrapper h2 {
				font-size: 22px;
			}
		}
	</style>

	<!-- Modernizr JS -->
	<script src="js/vendor/modernizr-2.8.3.min.js"></script>

</head>

<body>

	<!--Header Area Start-->
	<div id="header"></div>
	<!--End of Header Area-->

	<!--Banner Area Start-->
	<section class="about-bg">
		<div class="content-text">
			<h4>Registration Certificate</h4>
			<a href="index.html">Home</a> / <a href="Documents-and-Inforamation.html">Documents</a> / <span>Registration
				Certificate</span>
		</div>
	</section>
	<!--End of Banner Area-->

	<!-- Certificate Content Section -->
	<section class="cert-section">
		<div class="container">
			<div class="cert-title-wrapper">
				<h2>Registration Certificate</h2>
				<p>Official Registration Documents of Sankalp International School</p>
			</div>

			<div class="cert-gallery-grid">
				<div class="cert-card">
					<img src="img/doc-imgs/img4.jpg" alt="Registration Certificate Page 1">
					<div class="cert-card-label"><i class="fa-regular fa-file-image"
							style="color:#fdc735; margin-right:6px;"></i>Certificate Page 1</div>
				</div>
				<div class="cert-card">
					<img src="img/doc-imgs/img7.jpg" alt="Registration Certificate Page 2">
					<div class="cert-card-label"><i class="fa-regular fa-file-image"
							style="color:#fdc735; margin-right:6px;"></i>Certificate Page 2</div>
				</div>
				<div class="cert-card">
					<img src="img/doc-imgs/img10.jpg" alt="Registration Certificate Page 3">
					<div class="cert-card-label"><i class="fa-regular fa-file-image"
							style="color:#fdc735; margin-right:6px;"></i>Certificate Page 3</div>
				</div>
				<div class="cert-card">
					<img src="img/doc-imgs/img13.jpg" alt="Registration Certificate Page 4">
					<div class="cert-card-label"><i class="fa-regular fa-file-image"
							style="color:#fdc735; margin-right:6px;"></i>Certificate Page 4</div>
				</div>
				<div class="cert-card">
					<img src="img/doc-imgs/img16.jpg" alt="Registration Certificate Page 5">
					<div class="cert-card-label"><i class="fa-regular fa-file-image"
							style="color:#fdc735; margin-right:6px;"></i>Certificate Page 5</div>
				</div>
			</div>

			<div class="cert-back-btn-wrap">
				<a href="Documents-and-Inforamation.html" class="cert-back-btn">
					<i class="fa fa-arrow-left"></i> &nbsp;Back to Documents
				</a>
			</div>
		</div>
	</section>
	<!-- End of Certificate Content Section -->

	<!--Footer Area Start-->
	<div id="footer"></div>
	<!--End of Footer Area-->

	<!-- Scripts -->
	<script src="js/vendor/jquery-1.12.4.min.js"></script>
	<script src="js/popper.js"></script>
	<script src="js/bootstrap.min.js"></script>
	<script src="js/bootstrap-toggle.min.js"></script>
	<script src="lib/nivo-slider/js/jquery.nivo.slider.js"></script>
	<script src="lib/nivo-slider/home.js"></script>
	<script src="js/wow.min.js"></script>
	<script src="js/jquery.meanmenu.js"></script>
	<script src="js/owl.carousel.min.js"></script>
	<script src="js/jquery.countdown.min.js"></script>
	<script src="js/jquery.scrollUp.min.js"></script>
	<script src="js/waypoints.min.js"></script>
	<script src="js/jquery.counterup.min.js"></script>
	<script src="js/slick.min.js"></script>
	<script src="js/jquery.mixitup.js"></script>
	<script src="js/venobox.min.js"></script>
	<script src="js/plugins.js"></script>
	<script src="js/main.js"></script>
</body>

</html>
